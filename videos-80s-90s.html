<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Videos | Don Omar Radio Sessions</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
background:#02060b;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

body{
text-align:center;
}

.page{
width:100%;
max-width:1000px;
margin:auto;
padding:20px 12px 45px;
}

/* ENCABEZADO */

.header{
padding:22px 10px 12px;
border-radius:22px;
background:
linear-gradient(180deg,#07131f,#02070c);
border:1px solid #12344b;
box-shadow:
0 0 25px rgba(0,130,255,.12);
}

.logo{
font-size:44px;
font-weight:900;
line-height:1.05;
color:#f4f8ff;
text-shadow:
0 0 8px #fff,
0 0 20px rgba(0,150,255,.7);
}

.sessions{
margin-top:5px;
font-size:24px;
font-weight:800;
letter-spacing:9px;
color:#00cfff;
text-shadow:
0 0 12px #00bfff;
}

.slogan{
margin-top:14px;
font-size:16px;
letter-spacing:6px;
color:#dcefff;
}

/* VOLVER */

.back{
display:inline-block;
margin:22px 0 25px;
color:#00cfff;
text-decoration:none;
font-size:21px;
font-weight:600;
}

.back:hover{
text-shadow:0 0 12px #00cfff;
}

/* CARTEL PRINCIPAL */

.marquee{
position:relative;
width:96%;
margin:0 auto;
padding:24px 15px 22px;
border:4px solid #16b9ff;
border-radius:28px;
background:
radial-gradient(circle at center,#0a1724,#02070c 70%);
box-shadow:
0 0 12px #008cff,
0 0 30px rgba(0,140,255,.5),
inset 0 0 25px rgba(0,140,255,.15);
}

.marquee:before{
content:"";
position:absolute;
inset:7px;
border:2px solid #774cff;
border-radius:19px;
pointer-events:none;
box-shadow:
0 0 12px rgba(100,50,255,.8);
}

.aqui{
position:relative;
font-size:28px;
font-weight:900;
letter-spacing:2px;
color:#fff;
}

.cien{
position:relative;
margin:2px 0;
font-size:65px;
font-weight:900;
letter-spacing:3px;
color:#08caff;
text-shadow:
0 0 8px #00aaff,
0 0 22px rgba(0,180,255,.9);
}

.recomendados{
position:relative;
font-size:28px;
font-weight:900;
color:#fff;
letter-spacing:2px;
}

.baladas{
position:relative;
margin-top:7px;
font-size:27px;
font-weight:800;
color:#ff493f;
text-shadow:
0 0 8px rgba(255,50,40,.8),
0 0 18px rgba(255,40,30,.45);
}

/* INFORMACIÓN */

.info{
margin:14px auto 8px;
font-size:25px;
font-style:italic;
font-weight:700;
color:#ffc84a;
text-shadow:
0 0 8px rgba(255,190,40,.7);
}

.brand{
margin:0 auto 25px;
font-size:17px;
font-weight:700;
letter-spacing:7px;
color:#00cfff;
}

.brand:before,
.brand:after{
content:"";
display:inline-block;
width:100px;
height:1px;
background:#00cfff;
vertical-align:middle;
margin:0 20px;
box-shadow:0 0 8px #00cfff;
}

/* YOUTUBE */

.video-box{
width:96%;
margin:0 auto;
padding:4px;
border:3px solid #08aaff;
border-radius:23px;
background:#000;
box-shadow:
0 0 14px rgba(0,180,255,.8),
0 0 35px rgba(0,120,255,.35);
overflow:hidden;
}

.video{
width:100%;
aspect-ratio:16/9;
border:0;
display:block;
border-radius:17px;
}

/* PIE */

.footer-message{
width:94%;
margin:30px auto 0;
padding:23px 15px;
border:2px solid #123d59;
border-radius:20px;
background:#030a11;
box-shadow:
0 0 20px rgba(0,130,255,.12);
font-size:19px;
letter-spacing:5px;
color:#dcefff;
}

.footer-message:before{
content:"♫";
font-size:30px;
color:#00cfff;
margin-right:25px;
text-shadow:0 0 12px #00cfff;
}

.footer-message:after{
content:"♫";
font-size:30px;
color:#00cfff;
margin-left:25px;
text-shadow:0 0 12px #00cfff;
}

/* VOLVER FINAL */

.bottom{
display:block;
margin-top:38px;
color:#00cfff;
text-decoration:none;
font-size:22px;
font-weight:600;
}

.bottom:hover{
text-shadow:0 0 12px #00cfff;
}

.bottom:before,
.bottom:after{
content:"";
display:inline-block;
width:105px;
height:1px;
background:#00cfff;
vertical-align:middle;
margin:0 25px;
box-shadow:0 0 7px #00cfff;
}

/* CELULAR */

@media(max-width:600px){

.page{
padding:15px 7px 40px;
}

.logo{
font-size:36px;
}

.sessions{
font-size:21px;
letter-spacing:7px;
}

.slogan{
font-size:13px;
letter-spacing:4px;
}

.back{
font-size:20px;
margin:18px 0 22px;
}

.marquee{
width:96%;
padding:21px 10px 20px;
border-radius:23px;
}

.aqui{
font-size:23px;
}

.cien{
font-size:51px;
}

.recomendados{
font-size:23px;
}

.baladas{
font-size:21px;
}

.info{
font-size:20px;
}

.brand{
font-size:13px;
letter-spacing:5px;
margin-bottom:20px;
}

.brand:before,
.brand:after{
width:45px;
margin:0 10px;
}

.video-box{
width:96%;
border-radius:19px;
}

.video{
border-radius:14px;
}

.footer-message{
font-size:15px;
letter-spacing:3px;
padding:19px 8px;
}

.footer-message:before,
.footer-message:after{
margin:0 10px;
}

.bottom{
font-size:19px;
}

.bottom:before,
.bottom:after{
width:45px;
margin:0 9px;
}

}

</style>
</head>

<body>

<div class="page">

<header class="header">

<div class="logo">
Don Omar Radio
</div>

<div class="sessions">
SESSIONS
</div>

<div class="slogan">
MY MUSIC IN YOUR HEAD
</div>

</header>

<a
class="back"
href="https://donomardesing.github.io/Radio-sessions/">
← Volver
</a>

<section class="marquee">

<div class="aqui">
AQUI
</div>

<div class="cien">
100 VIDEOS
</div>

<div class="recomendados">
RECOMENDADOS
</div>

<div class="baladas">
DE BALADAS ROCKERAS
</div>

</section>

<div class="info">
Próximamente otra colección
</div>

<div class="brand">
DON OMAR RADIO SESSIONS
</div>

<div class="video-box">

<iframe
class="video"
src="https://www.youtube.com/embed/videoseries?list=PLJTxnI8yX9ye3s6w4p1BsLdsFCOd62tqb"
title="Don Omar Radio Sessions - Baladas Rockeras"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>

</div>

<div class="footer-message">
BALADAS QUE NUNCA PASAN DE MODA
</div>

<a
class="bottom"
href="https://donomardesing.github.io/Radio-sessions/">
← Volver a Radio Sessions
</a>

</div>

</body>
</html>
