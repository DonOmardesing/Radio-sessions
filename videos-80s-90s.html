<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baladas Rockeras | Don Omar Radio Sessions</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#050509;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   FONDO PRINCIPAL
========================= */

body{
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 50% 15%,rgba(0,190,255,.18),transparent 22%),
        radial-gradient(circle at 15% 35%,rgba(160,0,255,.18),transparent 25%),
        radial-gradient(circle at 85% 35%,rgba(255,0,60,.15),transparent 25%),
        linear-gradient(180deg,#05070b 0%,#09070d 45%,#030305 100%);
}

/* textura tipo ladrillo */

body:before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    opacity:.32;

    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);

    background-size:70px 35px;
}

/* iluminación ambiental */

body:after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;

    background:
        radial-gradient(circle at 50% 5%,rgba(0,210,255,.12),transparent 28%),
        radial-gradient(circle at 5% 55%,rgba(0,100,255,.10),transparent 30%),
        radial-gradient(circle at 95% 55%,rgba(255,0,90,.10),transparent 30%);
}

/* =========================
   CONTENEDOR
========================= */

.page{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:25px 18px 55px;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    position:relative;
    padding:20px 10px 28px;
}

.header-small{
    font-size:16px;
    letter-spacing:8px;
    color:#00d9ff;
    font-weight:bold;
    text-shadow:0 0 12px #00cfff;
    margin-bottom:8px;
}

.logo{
    font-size:58px;
    line-height:.95;
    font-weight:900;
    letter-spacing:2px;

    color:#fff;

    text-shadow:
        0 0 5px #fff,
        0 0 15px #00cfff,
        0 0 30px #007cff,
        0 0 55px rgba(0,140,255,.8);
}

.logo span{
    color:#00d9ff;
}

.good{
    margin-top:14px;
    font-size:18px;
    letter-spacing:7px;
    font-weight:bold;
    color:#fff;

    text-shadow:
        0 0 8px #fff,
        0 0 20px #00bfff;
}

.rock{
    margin-top:8px;
    font-size:23px;
    font-weight:900;
    letter-spacing:5px;

    color:#ff394d;

    text-shadow:
        0 0 8px #ff3045,
        0 0 20px rgba(255,0,40,.8);
}

/* =========================
   DECORACIÓN ROCK
========================= */

.decor{
    position:relative;
    height:135px;
    margin:5px auto 0;
}

.neon-line{
    position:absolute;
    top:50%;
    left:0;
    right:0;
    height:2px;

    background:#00d9ff;

    box-shadow:
        0 0 6px #00d9ff,
        0 0 18px #007cff,
        0 0 35px #00d9ff;
}

.vinyl{
    position:absolute;
    left:7%;
    top:17px;

    width:105px;
    height:105px;

    border-radius:50%;

    background:
        repeating-radial-gradient(
            circle,
            #090909 0px,
            #090909 5px,
            #202020 6px,
            #090909 8px
        );

    border:3px solid #222;

    box-shadow:
        0 0 10px #00bfff,
        0 0 30px rgba(0,190,255,.55);
}

.vinyl:after{
    content:"";
    position:absolute;
    width:30px;
    height:30px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#e7b400;
    border:7px solid #111;

    box-shadow:0 0 10px #ffcf32;
}

.headphones{
    position:absolute;
    right:7%;
    top:17px;

    width:115px;
    height:95px;

    border:10px solid #ff164c;
    border-bottom:0;
    border-radius:65px 65px 0 0;

    filter:
        drop-shadow(0 0 8px #ff164c)
        drop-shadow(0 0 20px rgba(255,0,80,.7));
}

.headphones:before,
.headphones:after{
    content:"";
    position:absolute;
    bottom:-10px;

    width:26px;
    height:48px;

    background:#ff164c;
    border-radius:10px;

    box-shadow:0 0 12px #ff164c;
}

.headphones:before{
    left:-17px;
}

.headphones:after{
    right:-17px;
}

/* =========================
   MARQUEE
========================= */

.marquee{
    margin:15px auto 30px;
    padding:20px 15px;

    border-top:2px solid #00d9ff;
    border-bottom:2px solid #00d9ff;

    background:
        linear-gradient(
            90deg,
            rgba(0,180,255,.04),
            rgba(0,180,255,.16),
            rgba(0,180,255,.04)
        );

    box-shadow:
        0 0 12px rgba(0,190,255,.35),
        inset 0 0 25px rgba(0,190,255,.06);

    text-align:center;
}

.marquee .line1{
    font-size:19px;
    font-weight:bold;
    letter-spacing:7px;
    color:#ffd33d;

    text-shadow:
        0 0 8px #ffbf00,
        0 0 18px rgba(255,190,0,.7);
}

.marquee .line2{
    margin-top:5px;

    font-size:36px;
    font-weight:900;
    letter-spacing:2px;

    color:#fff;

    text-shadow:
        0 0 7px #fff,
        0 0 18px #00cfff,
        0 0 35px #007cff;
}

.marquee .line3{
    margin-top:4px;

    font-size:19px;
    font-weight:bold;
    letter-spacing:6px;

    color:#00d9ff;

    text-shadow:
        0 0 8px #00d9ff,
        0 0 20px #007cff;
}

/* =========================
   SUBTÍTULO
========================= */

.collection{
    text-align:center;
    margin:0 0 24px;
}

.collection-title{
    font-size:22px;
    font-weight:bold;
    color:#fff;
    letter-spacing:4px;

    text-shadow:
        0 0 8px #ff3150,
        0 0 18px rgba(255,0,60,.7);
}

.collection-sub{
    margin-top:8px;
    color:#aaa;
    font-size:15px;
    letter-spacing:3px;
}

/* =========================
   VIDEO
========================= */

.video-frame{
    width:100%;
    max-width:1050px;
    margin:auto;

    padding:7px;

    border:2px solid #00d9ff;
    border-radius:18px;

    background:#000;

    box-shadow:
        0 0 12px #00d9ff,
        0 0 30px rgba(0,130,255,.55),
        0 0 60px rgba(140,0,255,.2);
}

.video{
    width:100%;
    aspect-ratio:16/9;

    border:0;
    border-radius:11px;
    display:block;
}

/* =========================
   FRASE INFERIOR
========================= */

.bottom-message{
    margin:32px auto 25px;
    text-align:center;
}

.bottom-message .main{
    font-size:27px;
    font-weight:900;
    letter-spacing:4px;

    color:#fff;

    text-shadow:
        0 0 8px #fff,
        0 0 18px #ff284c,
        0 0 32px rgba(255,0,60,.7);
}

.bottom-message .gold{
    margin-top:10px;

    font-size:17px;
    letter-spacing:5px;
    font-weight:bold;

    color:#ffd33d;

    text-shadow:
        0 0 8px #ffbf00,
        0 0 18px rgba(255,180,0,.65);
}

/* =========================
   BOTONES VOLVER
========================= */

.back{
    display:block;
    width:max-content;
    margin:25px auto 0;

    color:#00d9ff;
    text-decoration:none;

    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;

    padding:12px 25px;

    border:1px solid #00d9ff;
    border-radius:30px;

    box-shadow:
        0 0 10px rgba(0,200,255,.6),
        inset 0 0 12px rgba(0,200,255,.08);

    transition:.2s;
}

.back:hover{
    background:rgba(0,200,255,.12);
    box-shadow:
        0 0 18px rgba(0,200,255,.9),
        inset 0 0 18px rgba(0,200,255,.12);
}

.footer{
    text-align:center;
    margin-top:35px;

    color:#555;
    font-size:12px;
    letter-spacing:4px;
}

/* =========================
   MÓVIL
========================= */

@media(max-width:700px){

    .page{
        padding:15px 10px 40px;
    }

    .header{
        padding-top:12px;
    }

    .header-small{
        font-size:11px;
        letter-spacing:5px;
    }

    .logo{
        font-size:42px;
    }

    .good{
        font-size:13px;
        letter-spacing:4px;
    }

    .rock{
        font-size:17px;
        letter-spacing:3px;
    }

    .decor{
        height:105px;
    }

    .vinyl{
        width:78px;
        height:78px;
        top:14px;
    }

    .vinyl:after{
        width:23px;
        height:23px;
    }

    .headphones{
        width:82px;
        height:70px;
        top:14px;
        border-width:7px;
    }

    .headphones:before,
    .headphones:after{
        width:19px;
        height:35px;
    }

    .headphones:before{
        left:-13px;
    }

    .headphones:after{
        right:-13px;
    }

    .marquee{
        padding:16px 8px;
    }

    .marquee .line1{
        font-size:12px;
        letter-spacing:3px;
    }

    .marquee .line2{
        font-size:26px;
        line-height:1.1;
    }

    .marquee .line3{
        font-size:12px;
        letter-spacing:2px;
    }

    .collection-title{
        font-size:17px;
        letter-spacing:2px;
    }

    .collection-sub{
        font-size:12px;
        letter-spacing:1px;
    }

    .video-frame{
        padding:4px;
        border-radius:12px;
    }

    .video{
        border-radius:8px;
    }

    .bottom-message .main{
        font-size:20px;
        line-height:1.25;
        letter-spacing:2px;
    }

    .bottom-message .gold{
        font-size:13px;
        letter-spacing:2px;
    }

    .back{
        font-size:15px;
        padding:10px 20px;
    }
}

</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->

    <header class="header">

        <div class="header-small">
            DON OMAR RADIO SESSIONS
        </div>

        <div class="logo">
            Don Omar <span>Radio</span>
        </div>

        <div class="good">
            GOOD MUSIC NO LIMITS
        </div>

        <div class="rock">
            ROCK NEVER DIES
        </div>

    </header>


    <!-- DECORACIÓN -->

    <div class="decor">

        <div class="neon-line"></div>

        <div class="vinyl"></div>

        <div class="headphones"></div>

    </div>


    <!-- MARQUESINA -->

    <section class="marquee">

        <div class="line1">
            AQUI
        </div>

        <div class="line2">
            100 VIDEOS
        </div>

        <div class="line3">
            RECOMENDADOS DE BALADAS ROCKERAS
        </div>

    </section>


    <!-- COLECCIÓN -->

    <section class="collection">

        <div class="collection-title">
            PRÓXIMAMENTE OTRA COLECCIÓN
        </div>

        <div class="collection-sub">
            DON OMAR RADIO SESSIONS
        </div>

    </section>


    <!-- YOUTUBE -->

    <div class="video-frame">

        <iframe
            class="video"
            src="https://www.youtube.com/embed/videoseries?list=PLJTxnI8yX9ye3s6w4p1BsLdsFCOd62tqb"
            title="Baladas Rockeras - Don Omar Radio Sessions"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

    </div>


    <!-- MENSAJE -->

    <section class="bottom-message">

        <div class="main">
            BALADAS QUE NUNCA PASAN DE MODA
        </div>

        <div class="gold">
            DON OMAR RADIO SESSIONS
        </div>

    </section>


    <!-- VOLVER -->

    <a
        class="back"
        href="https://donomardesing.github.io/Radio-sessions/">
        ← Volver a Radio Sessions
    </a>


    <div class="footer">
        MY MUSIC IN YOUR HEAD
    </div>

</div>

</body>
</html>
