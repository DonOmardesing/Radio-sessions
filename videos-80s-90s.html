<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Don Omar Radio Sessions | Videos</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:
        radial-gradient(
            ellipse at 50% 15%,
            rgba(0,180,255,.16),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 8% 55%,
            rgba(0,80,255,.14),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 92% 55%,
            rgba(255,0,90,.10),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #01050a 0%,
            #020913 45%,
            #020309 100%
        );

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x:hidden;
}


/* =========================================
   FONDO DIGITAL
========================================= */

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(0,180,255,.035) 20%,
            transparent 50%,
            rgba(255,0,80,.035) 80%,
            transparent 100%
        );

    z-index:-2;
}


/* líneas laterales digitales */

body::after{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent 8%,
            rgba(0,140,255,.10) 8.2%,
            transparent 8.5%,
            transparent 91.5%,
            rgba(0,140,255,.10) 91.8%,
            transparent 92%
        );

    z-index:-1;
}


/* =========================================
   CONTENEDOR
========================================= */

.page{
    width:100%;
    max-width:1050px;

    margin:0 auto;

    padding:
        30px
        18px
        55px;
}


/* =========================================
   LOGO
========================================= */

.header{
    text-align:center;

    padding:
        5px
        0
        35px;
}

.brand{
    font-size:
        clamp(
            43px,
            7vw,
            78px
        );

    line-height:.95;

    font-weight:900;

    letter-spacing:-2px;

    color:#f7fbff;

    text-shadow:
        0 0 5px #fff,
        0 0 13px #d9f7ff,
        0 0 28px #00bfff,
        0 0 55px rgba(0,150,255,.7);
}

.brand span{
    display:block;

    color:#00cfff;

    text-shadow:
        0 0 7px #00e5ff,
        0 0 18px #00aaff,
        0 0 38px rgba(0,170,255,.75);
}


/* =========================================
   PANEL PRINCIPAL
========================================= */

.video-panel{
    position:relative;

    width:100%;

    padding:
        35px
        25px
        38px;

    border:
        2px solid #00cfff;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(0,30,55,.65),
            rgba(3,8,25,.88)
        );

    box-shadow:
        0 0 10px #00cfff,
        0 0 35px rgba(0,160,255,.35),
        inset 0 0 35px rgba(0,130,255,.08);
}


/* pequeña barra superior */

.video-panel::before{

    content:"";

    position:absolute;

    top:-3px;
    left:50%;

    transform:translateX(-50%);

    width:115px;
    height:5px;

    border-radius:10px;

    background:#00e5ff;

    box-shadow:
        0 0 8px #00e5ff,
        0 0 22px #008cff;
}


/* =========================================
   TITULO DEL PANEL
========================================= */

.small-title{

    text-align:center;

    font-size:
        clamp(
            15px,
            2vw,
            21px
        );

    letter-spacing:
        clamp(
            5px,
            1vw,
            10px
        );

    color:#fff;

    margin-bottom:8px;
}


.big-title{

    text-align:center;

    font-size:
        clamp(
            38px,
            6vw,
            66px
        );

    line-height:1;

    font-weight:900;

    color:#fff;

    letter-spacing:2px;

    text-shadow:
        0 0 5px #fff,
        0 0 13px #c7f7ff,
        0 0 28px #00cfff,
        0 0 55px rgba(0,150,255,.75);
}


.description{

    text-align:center;

    margin-top:16px;

    font-size:
        clamp(
            13px,
            2vw,
            19px
        );

    letter-spacing:
        clamp(
            2px,
            .6vw,
            5px
        );

    color:#00d9ff;

    font-weight:700;

    text-shadow:
        0 0 7px #00d9ff,
        0 0 18px rgba(0,150,255,.7);
}


/* =========================================
   COLECCIÓN
========================================= */

.collection{

    text-align:center;

    margin:
        42px auto
        25px;
}

.collection-title{

    font-size:
        clamp(
            20px,
            3vw,
            30px
        );

    font-weight:800;

    letter-spacing:
        clamp(
            2px,
            .5vw,
            5px
        );

    color:#fff;

    text-shadow:
        0 0 6px #fff,
        0 0 15px rgba(0,210,255,.45);
}

.collection-line{

    width:110px;

    height:3px;

    margin:
        16px auto
        0;

    background:#00d9ff;

    box-shadow:
        0 0 7px #00d9ff,
        0 0 18px #008cff;
}


/* =========================================
   YOUTUBE
========================================= */

.youtube-frame{

    width:100%;

    padding:6px;

    border:
        2px solid #00d9ff;

    border-radius:22px;

    background:#000;

    box-shadow:
        0 0 12px #00d9ff,
        0 0 30px rgba(0,170,255,.55),
        0 0 60px rgba(0,100,255,.20);
}

.youtube{

    width:100%;

    aspect-ratio:16 / 9;

    display:block;

    border:0;

    border-radius:15px;

    background:#000;
}


/* =========================================
   BOTÓN VOLVER
========================================= */

.back{

    display:flex;

    justify-content:center;
    align-items:center;

    width:max-content;

    min-width:360px;

    margin:
        45px auto
        0;

    padding:
        17px
        35px;

    border:
        2px solid #00d9ff;

    border-radius:50px;

    color:#00d9ff;

    text-decoration:none;

    font-size:
        clamp(
            14px,
            2vw,
            18px
        );

    font-weight:800;

    letter-spacing:
        clamp(
            2px,
            .5vw,
            4px
        );

    background:
        rgba(0,80,140,.08);

    box-shadow:
        0 0 10px rgba(0,210,255,.75),
        0 0 25px rgba(0,150,255,.25),
        inset 0 0 15px rgba(0,200,255,.08);

    transition:.2s;
}

.back:hover{

    background:
        rgba(0,180,255,.12);

    box-shadow:
        0 0 18px #00d9ff,
        0 0 40px rgba(0,150,255,.45);
}


/* =========================================
   MÓVIL
========================================= */

@media(max-width:600px){

    .page{

        padding:
            20px
            10px
            40px;
    }

    .header{

        padding-bottom:28px;
    }

    .video-panel{

        padding:
            28px
            12px
            28px;

        border-radius:19px;
    }

    .small-title{

        letter-spacing:4px;
    }

    .big-title{

        font-size:42px;

        letter-spacing:1px;
    }

    .description{

        line-height:1.45;

        padding:
            0
            10px;
    }

    .collection{

        margin-top:34px;
    }

    .collection-title{

        line-height:1.25;

        padding:
            0
            12px;
    }

    .youtube-frame{

        padding:4px;

        border-radius:17px;
    }

    .youtube{

        border-radius:11px;
    }

    .back{

        min-width:0;

        width:90%;

        padding:
            14px
            15px;

        text-align:center;
    }

}

</style>

</head>


<body>


<div class="page">


    <!-- =====================================
         CABECERA
    ====================================== -->

    <header class="header">

        <div class="brand">
            Don Omar
            <span>Radio</span>
        </div>

    </header>



    <!-- =====================================
         PANEL DIGITAL
    ====================================== -->

    <section class="video-panel">

        <div class="small-title">
            AQUI
        </div>

        <div class="big-title">
            100 VIDEOS
        </div>

        <div class="description">
            RECOMENDADOS DE BALADAS ROCKERAS
        </div>

    </section>



    <!-- =====================================
         COLECCIÓN
    ====================================== -->

    <section class="collection">

        <div class="collection-title">
            PRÓXIMAMENTE OTRA COLECCIÓN
        </div>

        <div class="collection-line"></div>

    </section>



    <!-- =====================================
         YOUTUBE
    ====================================== -->

    <div class="youtube-frame">

        <iframe
            class="youtube"
            src="https://www.youtube.com/embed/videoseries?list=PLJTxnI8yX9ye3s6w4p1BsLdsFCOd62tqb"
            title="Don Omar Radio Sessions - Baladas Rockeras"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>

    </div>



    <!-- =====================================
         VOLVER
    ====================================== -->

    <a
        class="back"
        href="https://donomardesing.github.io/Radio-sessions/">

        ← &nbsp; VOLVER A DON OMAR RADIO SESSIONS

    </a>


</div>


</body>
</html>
