<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Don Omar Radio Sessions — Videos</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#030405;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

.page{
  width:100%;
  max-width:760px;
  margin:0 auto;
  background:
    radial-gradient(circle at 50% 25%,rgba(0,120,255,.10),transparent 35%),
    linear-gradient(180deg,#080a0d 0%,#020304 100%);
  min-height:100vh;
}

/* CABECERA */

.header{
  width:100%;
  background:#000;
  border-bottom:2px solid #0b84ff;
  box-shadow:0 0 22px rgba(0,132,255,.35);
  overflow:hidden;
}

.header img{
  width:100%;
  height:auto;
  display:block;
}

/* CONTENIDO */

.content{
  padding:28px 18px 45px;
}

.kicker{
  text-align:center;
  color:#00bfff;
  font-size:14px;
  font-weight:900;
  letter-spacing:5px;
  margin-bottom:8px;
  text-shadow:
    0 0 8px rgba(0,191,255,.8),
    0 0 18px rgba(0,132,255,.45);
}

.title{
  text-align:center;
  font-size:clamp(34px,9vw,58px);
  line-height:.95;
  font-weight:900;
  letter-spacing:3px;
  color:#fff;
  text-shadow:
    0 0 8px rgba(255,255,255,.35),
    0 0 22px rgba(0,132,255,.55);
  margin-bottom:12px;
}

.subtitle{
  text-align:center;
  color:#00c8ff;
  font-size:14px;
  font-weight:700;
  letter-spacing:1px;
  line-height:1.5;
  margin:0 auto 25px;
  max-width:600px;
}

/* VIDEO */

.video-box{
  width:100%;
  background:#020508;
  border:2px solid #078cff;
  border-radius:20px;
  padding:5px;
  box-shadow:
    0 0 10px rgba(0,140,255,.75),
    0 0 30px rgba(0,100,255,.28),
    inset 0 0 20px rgba(0,120,255,.10);
}

.video-frame{
  width:100%;
  aspect-ratio:16 / 9;
  display:block;
  border:0;
  border-radius:14px;
  background:#000;
}

/* TEXTO INFERIOR */

.rock-note{
  margin:22px auto 25px;
  text-align:center;
  color:#b9c7d4;
  font-size:11px;
  letter-spacing:2px;
  line-height:1.6;
  text-transform:uppercase;
}

/* BOTÓN REGRESAR */

.back{
  display:flex;
  width:max-content;
  margin:0 auto;
  padding:12px 22px;
  border:1px solid #00aaff;
  border-radius:999px;
  background:linear-gradient(180deg,#071a29,#030b12);
  color:#00c8ff;
  text-decoration:none;
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
  box-shadow:
    0 0 12px rgba(0,170,255,.35),
    inset 0 0 10px rgba(0,170,255,.08);
  transition:.15s ease;
}

.back:active{
  transform:scale(.96);
}

/* PIE */

.footer{
  text-align:center;
  padding:0 15px 25px;
  color:#555d65;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* MÓVIL */

@media(max-width:430px){

  .content{
    padding:25px 13px 40px;
  }

  .kicker{
    font-size:12px;
    letter-spacing:4px;
  }

  .title{
    font-size:38px;
    letter-spacing:2px;
  }

  .subtitle{
    font-size:13px;
    padding:0 8px;
  }

  .video-box{
    border-radius:17px;
    padding:4px;
  }

  .video-frame{
    border-radius:12px;
  }
}
</style>
</head>

<body>

<div class="page">

  <header class="header">
    <img
      src="822acf96-fd61-46a2-ad42-239a8b8c1237.jpeg"
      alt="Don Omar Radio Sessions"
    >
  </header>

  <main class="content">

    <div class="kicker">VIDEOS</div>

    <h1 class="title">MIS VIDEOS RECOMENDADOS</h1>

    <p class="subtitle">
      Porque marcaron nuestra época dorada del rock.
    </p>

    <div class="video-box">

      <iframe
        class="video-frame"
        src="https://www.youtube.com/embed/videoseries?list=PLafKh5hA5TEmNIMSdJst37tqMJYXB4AS9"
        title="Don Omar Radio Sessions — Videos recomendados"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>

    </div>

    <div class="rock-note">
      Colección privada con excelentes recuerdos incluidos.
    </div>

    <a
      class="back"
      href="https://donomardesing.github.io/Radio-sessions/">
      ← VOLVER A DON OMAR RADIO SESSIONS
    </a>

  </main>

  <footer class="footer">
    DON OMAR RADIO · MEDELLÍN · COLOMBIA
  </footer>

</div>

</body>
</html>
