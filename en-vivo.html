<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>En vivo | Don Omar Radio</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#03070b;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    text-align:center;
}

.wrap{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:30px 8px 45px;
}

/* =========================
   EN VIVO
========================= */

.live{
    display:inline-block;
    padding:13px 28px;
    border:2px solid #ff3b30;
    border-radius:40px;
    color:#ff5a55;
    font-size:20px;
    font-weight:bold;
    margin-bottom:25px;
    box-shadow:0 0 18px rgba(255,59,48,.12);
}

/* =========================
   TARJETA
========================= */

.card{
    width:100%;
    background:#101214;
    border:1px solid #292d30;
    border-radius:22px;
    padding:28px 8px 32px;
    box-shadow:0 0 40px rgba(0,130,190,.10);
}

h1{
    margin:0 0 8px;
    font-size:38px;
    line-height:1.1;
}

.subtitle{
    margin:0 0 28px;
    color:#aaa;
    font-size:23px;
}

/* =========================
   TWITCH
========================= */

.player-box{
    width:100%;
    aspect-ratio:16 / 9;
    background:#000;
    border-radius:18px;
    overflow:hidden;

    border:3px solid #0879b8;

    box-shadow:
        0 0 15px rgba(0,150,255,.35),
        0 0 35px rgba(0,100,180,.18);
}

#twitch-embed{
    width:100%;
    height:100%;
}

/* =========================
   BOTÓN FUTURISTA
========================= */

.play-btn{
    position:relative;

    display:block;

    width:96%;
    max-width:850px;

    margin:28px auto 14px;

    padding:22px 20px;

    border:2px solid #00aaff;
    border-radius:18px;

    background:
        linear-gradient(
            90deg,
            #06131f,
            #092b43,
            #06131f
        );

    color:#dff7ff;

    font-size:24px;
    font-weight:800;
    letter-spacing:1px;

    cursor:pointer;

    box-shadow:
        0 0 10px rgba(0,170,255,.55),
        inset 0 0 18px rgba(0,130,255,.18);

    transition:
        transform .15s,
        box-shadow .2s;
}

.play-btn::before{
    content:"▶";

    display:inline-flex;
    align-items:center;
    justify-content:center;

    width:42px;
    height:42px;

    margin-right:12px;

    border:2px solid #00c8ff;
    border-radius:50%;

    color:#00d9ff;

    text-shadow:
        0 0 8px #00c8ff;

    box-shadow:
        0 0 12px rgba(0,200,255,.55);
}

.play-btn::after{
    content:"";
    position:absolute;

    left:4%;
    right:4%;
    bottom:5px;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00c8ff,
            transparent
        );

    opacity:.8;
}

.play-btn:active{
    transform:scale(.97);

    box-shadow:
        0 0 25px rgba(0,200,255,.8),
        inset 0 0 25px rgba(0,130,255,.3);
}

.play-btn:hover{
    box-shadow:
        0 0 18px rgba(0,200,255,.75),
        0 0 40px rgba(0,120,255,.25),
        inset 0 0 22px rgba(0,130,255,.25);
}

/* =========================
   ESTADO
========================= */

.status{
    margin:12px 10px 0;

    color:#9da8b3;

    font-size:17px;

    line-height:1.4;
}

/* =========================
   VOLVER
========================= */

.back{
    display:block;

    margin-top:35px;

    color:#aaa;

    text-decoration:none;

    font-size:19px;
}

.back:hover{
    color:#fff;
}


/* =========================
   CELULARES
========================= */

@media(max-width:600px){

    .wrap{
        padding:28px 6px 45px;
    }

    .live{
        font-size:18px;
        padding:12px 25px;
        margin-bottom:22px;
    }

    .card{
        padding:25px 6px 30px;
        border-radius:21px;
    }

    h1{
        font-size:36px;
    }

    .subtitle{
        font-size:22px;
        margin-bottom:28px;
    }

    /*
       Aprovechamos prácticamente
       todo el ancho del iPhone.
    */

    .player-box{
        width:100%;
        border-radius:17px;
    }

    .play-btn{
        width:96%;

        padding:20px 8px;

        font-size:20px;

        letter-spacing:.5px;
    }

    .play-btn::before{
        width:40px;
        height:40px;
        margin-right:9px;
    }

    .status{
        font-size:16px;
    }

}

</style>
</head>


<body>

<div class="wrap">


    <!-- EN VIVO -->

    <div class="live">
        ● EN VIVO
    </div>


    <!-- TARJETA PRINCIPAL -->

    <div class="card">

        <h1>
            Don Omar Radio
        </h1>

        <p class="subtitle">
            Transmisión en vivo
        </p>


        <!-- =====================
             REPRODUCTOR TWITCH
        ====================== -->

        <div class="player-box">

            <div id="twitch-embed"></div>

        </div>


        <!-- =====================
             BOTÓN ESCUCHAR
        ====================== -->

        <button
            id="playButton"
            class="play-btn">

            ESCUCHAR EN VIVO

        </button>


        <p
            id="status"
            class="status">

            Pulsa el botón para comenzar la transmisión.

        </p>

    </div>


    <!-- VOLVER -->

    <a
        class="back"
        href="index.html">

        ← Volver a Radio Sessions

    </a>

</div>



<!-- =========================
     TWITCH PLAYER
========================= -->

<script src="https://embed.twitch.tv/embed/v1.js"></script>


<script>

var embed = new Twitch.Embed(
    "twitch-embed",
    {

        width: "100%",
        height: "100%",

        channel: "donomar_radio_medellin",

        layout: "video",

        autoplay: false,

        muted: false,

        parent: [
            "donomardesing.github.io"
        ]

    }
);


var playButton =
    document.getElementById("playButton");

var status =
    document.getElementById("status");


/* =========================
   TWITCH LISTO
========================= */

embed.addEventListener(
    Twitch.Embed.VIDEO_READY,
    function(){

        status.textContent =
            "Listo. Pulsa el botón para comenzar.";

    }
);


/* =========================
   BOTÓN PLAY
========================= */

playButton.addEventListener(
    "click",
    function(){

        var player =
            embed.getPlayer();

        player.play();

        playButton.textContent =
            "🔊  CONECTANDO...";

        status.textContent =
            "Conectando con la transmisión en vivo...";

    }
);


/* =========================
   TRANSMISIÓN INICIADA
========================= */

embed.addEventListener(
    Twitch.Embed.VIDEO_PLAY,
    function(){

        playButton.textContent =
            "🔊  ESCUCHANDO EN VIVO";

        status.textContent =
            "Estás escuchando la transmisión en vivo.";

    }
);

</script>

</body>
</html>
