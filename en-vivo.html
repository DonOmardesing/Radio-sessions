<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>En vivo | Don Omar Radio</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    text-align:center;
}

.wrap{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:35px 14px 50px;
}

/* EN VIVO */

.live{
    display:inline-block;
    padding:13px 28px;
    border:2px solid #ff3b30;
    border-radius:40px;
    color:#ff5a55;
    font-size:20px;
    font-weight:bold;
    margin-bottom:25px;
}

/* TARJETA */

.card{
    width:100%;
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    padding:25px 14px 30px;
    box-shadow:0 0 35px rgba(0,80,120,.12);
}

h1{
    margin:0 0 8px;
    font-size:34px;
}

.subtitle{
    margin:0 0 25px;
    color:#aaa;
    font-size:21px;
}

/* REPRODUCTOR TWITCH */

.player-box{
    width:100%;
    aspect-ratio:16 / 9;
    background:#000;
    border-radius:18px;
    overflow:hidden;
    border:2px solid #075b87;
    box-shadow:0 0 25px rgba(0,120,180,.20);
}

#twitch-embed{
    width:100%;
    height:100%;
}

/* BOTÓN GRANDE */

.play-btn{
    display:block;
    width:95%;
    max-width:620px;
    margin:28px auto 12px;

    padding:21px 25px;

    border:none;
    border-radius:16px;

    background:#4ade80;
    color:#000;

    font-size:22px;
    font-weight:800;

    cursor:pointer;

    box-shadow:0 8px 25px rgba(74,222,128,.25);

    transition:transform .15s, box-shadow .15s;
}

.play-btn:active{
    transform:scale(.97);
}

.play-btn:hover{
    box-shadow:0 10px 30px rgba(74,222,128,.40);
}

/* ESTADO */

.status{
    margin:12px 10px 0;
    color:#aaa;
    font-size:16px;
}

/* VOLVER */

.back{
    display:block;
    margin-top:35px;
    color:#aaa;
    text-decoration:none;
    font-size:18px;
}

.back:hover{
    color:#fff;
}


/* CELULARES */

@media(max-width:600px){

    .wrap{
        padding:28px 10px 45px;
    }

    .live{
        font-size:18px;
        padding:12px 25px;
        margin-bottom:22px;
    }

    .card{
        padding:24px 10px 28px;
        border-radius:20px;
    }

    h1{
        font-size:30px;
    }

    .subtitle{
        font-size:20px;
        margin-bottom:22px;
    }

    .player-box{
        border-radius:16px;
    }

    .play-btn{
        width:96%;
        padding:20px 15px;
        font-size:21px;
        margin-top:25px;
    }

    .status{
        font-size:15px;
        line-height:1.4;
    }

}

</style>
</head>


<body>

<div class="wrap">

    <div class="live">
        ● EN VIVO
    </div>


    <div class="card">

        <h1>
            Don Omar Radio
        </h1>

        <p class="subtitle">
            Transmisión en vivo
        </p>


        <!-- TWITCH -->

        <div class="player-box">

            <div id="twitch-embed"></div>

        </div>


        <!-- BOTÓN PRINCIPAL -->

        <button
            id="playButton"
            class="play-btn">
            
            ▶ &nbsp; ESCUCHAR EN VIVO

        </button>


        <p
            id="status"
            class="status">

            Pulsa el botón para comenzar la transmisión.

        </p>

    </div>


    <a
        class="back"
        href="index.html">

        ← Volver a Radio Sessions

    </a>

</div>



<!-- TWITCH PLAYER -->

<script src="https://embed.twitch.tv/embed/v1.js"></script>


<script>

var embed = new Twitch.Embed(
    "twitch-embed",
    {

        width: "100%",
        height: "100%",

        channel: "donomar_radio_medellin",

        layout: "video",

        autoplay: false,

        muted: false,

        parent: [
            "donomardesing.github.io"
        ]

    }
);



var playButton =
    document.getElementById("playButton");

var status =
    document.getElementById("status");



/* TWITCH LISTO */

embed.addEventListener(
    Twitch.Embed.VIDEO_READY,
    function(){

        status.textContent =
            "Listo. Pulsa ▶ ESCUCHAR EN VIVO.";

    }
);



/* BOTÓN GRANDE */

playButton.addEventListener(
    "click",
    function(){

        var player =
            embed.getPlayer();

        player.play();

        playButton.textContent =
            "🔊  CONECTANDO...";

        status.textContent =
            "Conectando con la transmisión en vivo...";

    }
);



/* CUANDO COMIENZA LA TRANSMISIÓN */

embed.addEventListener(
    Twitch.Embed.VIDEO_PLAY,
    function(){

        playButton.textContent =
            "🔊  ESCUCHANDO EN VIVO";

        status.textContent =
            "Estás escuchando la transmisión en vivo.";

    }
);

</script>

</body>
</html>
