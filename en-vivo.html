<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>En vivo | Don Omar Radio Sessions</title>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
background:#02070b;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

body{
text-align:center;
}

.wrap{
width:100%;
max-width:1000px;
margin:auto;
padding:22px 12px 45px;
}

/* EN VIVO */

.live{
display:inline-block;
padding:12px 32px;
border:3px solid #ff3b30;
border-radius:50px;
color:#ff625a;
font-size:24px;
font-weight:800;
margin-bottom:24px;
box-shadow:
0 0 10px rgba(255,40,30,.7),
0 0 28px rgba(255,40,30,.25);
}

/* TARJETA PRINCIPAL */

.card{
width:100%;
background:
radial-gradient(circle at 50% 0%,rgba(0,120,190,.08),transparent 35%),
#090d11;
border:1px solid #163447;
border-radius:24px;
padding:28px 12px 38px;
box-shadow:
0 0 30px rgba(0,120,190,.08);
}

/* TITULO */

h1{
margin:0;
font-size:46px;
font-weight:900;
line-height:1.05;
text-shadow:
0 0 8px rgba(255,255,255,.3),
0 0 18px rgba(0,160,255,.35);
}

.subtitle{
margin:12px 0 12px;
font-size:27px;
color:#b8b8b8;
}

.tagline{
margin:0 0 30px;
font-size:17px;
font-weight:700;
letter-spacing:7px;
color:#00caff;
text-shadow:0 0 12px rgba(0,200,255,.7);
}

/* LINEAS DECORATIVAS */

.tagline:before,
.tagline:after{
content:"";
display:inline-block;
width:110px;
height:1px;
background:#00caff;
vertical-align:middle;
margin:0 22px;
box-shadow:0 0 8px #00caff;
}

/* TWITCH */

.player-box{
width:100%;
aspect-ratio:16/9;
background:#000;
border-radius:22px;
overflow:hidden;
border:4px solid #08a9ff;
box-shadow:
0 0 14px rgba(0,170,255,.8),
0 0 35px rgba(0,130,255,.3);
}

#twitch-embed{
width:100%;
height:100%;
}

/* BOTON ESCUCHAR */

.play-btn{
display:flex;
align-items:center;
justify-content:center;
gap:25px;
width:94%;
max-width:900px;
margin:32px auto 0;
padding:24px 18px;
border:3px solid #18b9ff;
border-radius:22px;
background:
linear-gradient(90deg,#06131f,#092b43,#06131f);
color:#e9faff;
font-size:25px;
font-weight:900;
letter-spacing:1px;
cursor:pointer;
box-shadow:
0 0 12px rgba(0,180,255,.75),
0 0 35px rgba(0,120,255,.25),
inset 0 0 22px rgba(0,140,255,.15);
transition:.15s;
}

.play-btn:hover{
filter:brightness(1.2);
}

.play-btn:active{
transform:scale(.97);
}

.play-icon{
display:flex;
align-items:center;
justify-content:center;
width:58px;
height:58px;
border:3px solid #35caff;
border-radius:50%;
font-size:27px;
color:#48d5ff;
text-shadow:0 0 10px #00c8ff;
box-shadow:
0 0 14px rgba(0,200,255,.7);
}

/* TEXTO UNIRSE */

.unirse{
margin:25px auto 18px;
display:flex;
align-items:center;
justify-content:center;
gap:28px;
font-size:27px;
font-weight:600;
color:#e8f8ff;
text-shadow:0 0 10px rgba(0,180,255,.45);
}

.unirse:before,
.unirse:after{
content:"";
height:1px;
width:115px;
background:#36cfff;
box-shadow:0 0 8px #36cfff;
}

/* BOTON VIP */

.vip-link{
display:flex;
align-items:center;
justify-content:center;
gap:24px;
width:94%;
max-width:900px;
margin:0 auto;
padding:20px 20px;
border:3px solid #36ff70;
border-radius:22px;
background:
linear-gradient(90deg,#031407,#06240d,#031407);
text-decoration:none;
box-shadow:
0 0 14px rgba(40,255,90,.8),
0 0 38px rgba(30,255,80,.25),
inset 0 0 25px rgba(30,255,70,.12);
transition:.15s;
}

.vip-link:hover{
filter:brightness(1.2);
}

.vip-link:active{
transform:scale(.97);
}

.whatsapp{
display:flex;
align-items:center;
justify-content:center;
width:76px;
height:76px;
border:3px solid #63ff8c;
border-radius:50%;
font-size:43px;
color:#fff;
box-shadow:
0 0 14px rgba(40,255,90,.8);
flex-shrink:0;
}

.vip-text{
display:flex;
flex-direction:column;
align-items:center;
line-height:1.1;
}

.vip-title{
font-size:39px;
font-weight:900;
color:#38ff69;
letter-spacing:1px;
text-shadow:
0 0 7px #24ff58,
0 0 20px rgba(30,255,80,.75);
}

.vip-subtitle{
margin-top:6px;
font-size:22px;
font-weight:600;
color:#fff;
}

.vip-arrow{
font-size:48px;
font-weight:900;
color:#65ff8b;
text-shadow:0 0 12px #35ff70;
}

/* VOLVER */

.back{
display:block;
margin-top:42px;
color:#72cfff;
text-decoration:none;
font-size:21px;
}

.back:before{
content:"";
display:inline-block;
width:110px;
height:1px;
background:#249ed0;
vertical-align:middle;
margin-right:28px;
box-shadow:0 0 7px #249ed0;
}

.back:after{
content:"";
display:inline-block;
width:110px;
height:1px;
background:#249ed0;
vertical-align:middle;
margin-left:28px;
box-shadow:0 0 7px #249ed0;
}

/* MOVIL */

@media(max-width:600px){

.wrap{
padding:20px 8px 42px;
}

.live{
font-size:21px;
padding:11px 27px;
}

.card{
padding:26px 6px 34px;
border-radius:22px;
}

h1{
font-size:40px;
}

.subtitle{
font-size:25px;
}

.tagline{
font-size:13px;
letter-spacing:5px;
margin-bottom:27px;
}

.tagline:before,
.tagline:after{
width:55px;
margin:0 12px;
}

.player-box{
border-radius:20px;
}

.play-btn{
width:94%;
padding:21px 10px;
gap:15px;
font-size:20px;
}

.play-icon{
width:55px;
height:55px;
font-size:25px;
}

.unirse{
font-size:25px;
gap:15px;
}

.unirse:before,
.unirse:after{
width:55px;
}

.vip-link{
width:94%;
padding:17px 12px;
gap:12px;
}

.whatsapp{
width:65px;
height:65px;
font-size:36px;
}

.vip-title{
font-size:30px;
}

.vip-subtitle{
font-size:17px;
}

.vip-arrow{
font-size:36px;
}

.back{
font-size:19px;
}

.back:before,
.back:after{
width:45px;
margin-left:8px;
margin-right:8px;
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="live">● EN VIVO</div>

<div class="card">

<h1>Don Omar Radio</h1>

<p class="subtitle">Transmisión en vivo</p>

<div class="tagline">MY MUSIC IN YOUR HEAD</div>

<div class="player-box">
<div id="twitch-embed"></div>
</div>

<button id="playButton" class="play-btn">
<span class="play-icon">▶</span>
<span>ESCUCHAR EN VIVO</span>
</button>

<div class="unirse">
<span>Unirse</span>
</div>

<a
class="vip-link"
href="https://chat.whatsapp.com/CN6gqGTeo1vAFBmoQTvoJ0?mode=gi_t"
target="_blank"
rel="noopener noreferrer">

<span class="whatsapp">◔</span>

<span class="vip-text">
<span class="vip-title">CANAL VIP</span>
<span class="vip-subtitle">Don Omar Radio Sessions</span>
</span>

<span class="vip-arrow">»</span>

</a>

</div>

<a class="back" href="https://donomardesing.github.io/Radio-sessions/">
← Volver a Radio Sessions
</a>

</div>

<script src="https://embed.twitch.tv/embed/v1.js"></script>

<script>

var embed = new Twitch.Embed("twitch-embed",{
width:"100%",
height:"100%",
channel:"donomar_radio_medellin",
layout:"video",
autoplay:false,
muted:false,
parent:["donomardesing.github.io"]
});

var playButton = document.getElementById("playButton");

embed.addEventListener(
Twitch.Embed.VIDEO_READY,
function(){

playButton.innerHTML =
'<span class="play-icon">▶</span><span>ESCUCHAR EN VIVO</span>';

}
);

playButton.addEventListener(
"click",
function(){

var player = embed.getPlayer();

player.play();

playButton.innerHTML =
'<span class="play-icon">🔊</span><span>ESCUCHANDO EN VIVO</span>';

}
);

embed.addEventListener(
Twitch.Embed.VIDEO_PLAY,
function(){

playButton.innerHTML =
'<span class="play-icon">🔊</span><span>ESCUCHANDO EN VIVO</span>';

}
);

</script>

</body>
</html>
