<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>En vivo | Don Omar Radio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
}

.wrap{
    max-width:700px;
    margin:auto;
    padding:40px 18px;
}

.live{
    display:inline-block;
    padding:12px 22px;
    border:1px solid #ff3b30;
    border-radius:30px;
    color:#ff3b30;
    font-weight:bold;
    font-size:15px;
}

.card{
    margin-top:25px;
    background:#151515;
    border-radius:18px;
    padding:25px 18px;
}

h1{
    margin:5px 0 8px;
    font-size:28px;
}

.subtitle{
    color:#aaa;
    margin-bottom:22px;
}

/* REPRODUCTOR */
.player-box{
    width:100%;
    aspect-ratio:16 / 9;
    background:#000;
    border-radius:12px;
    overflow:hidden;
}

/* BOTÓN PLAY */
.play-btn{
    display:block;
    width:100%;
    max-width:360px;
    margin:22px auto 10px;
    padding:16px 20px;
    border:0;
    border-radius:12px;
    background:#4ade80;
    color:#000;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.play-btn:active{
    transform:scale(.98);
}

.status{
    color:#aaa;
    font-size:14px;
    margin-top:10px;
}

.back{
    display:block;
    margin-top:28px;
    color:#aaa;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="wrap">

    <div class="live">● EN VIVO</div>

    <div class="card">

        <h1>Don Omar Radio</h1>

        <p class="subtitle">
            Transmisión en vivo
        </p>

        <!-- REPRODUCTOR TWITCH -->
        <div class="player-box">
            <div id="twitch-embed"></div>
        </div>

        <!-- BOTÓN PLAY -->
        <button id="playButton" class="play-btn">
            ▶ ESCUCHAR EN VIVO
        </button>

        <p id="status" class="status">
            Pulsa el botón para comenzar la transmisión.
        </p>

    </div>

    <a class="back" href="index.html">
        ← Volver
    </a>

</div>


<!-- TWITCH -->
<script src="https://embed.twitch.tv/embed/v1.js"></script>

<script>

var embed = new Twitch.Embed("twitch-embed", {

    width: "100%",
    height: "100%",

    channel: "donomar_radio_medellin",

    layout: "video",

    autoplay: false,

    muted: false,

    parent: ["donomardesing.github.io"]

});


var playButton = document.getElementById("playButton");
var status = document.getElementById("status");


/* CUANDO TWITCH ESTÉ LISTO */
embed.addEventListener(Twitch.Embed.VIDEO_READY, function() {

    status.textContent =
        "Listo. Pulsa ▶ ESCUCHAR EN VIVO.";

});


/* BOTÓN PERSONALIZADO */
playButton.addEventListener("click", function() {

    var player = embed.getPlayer();

    player.play();

    playButton.textContent = "🔊 ESCUCHANDO EN VIVO";

    status.textContent =
        "Conectando con la transmisión...";

});


/* CUANDO REALMENTE EMPIECE */
embed.addEventListener(Twitch.Embed.VIDEO_PLAY, function() {

    playButton.textContent =
        "🔊 EN VIVO";

    status.textContent =
        "Estás escuchando la transmisión en vivo.";

});

</script>

</body>
</html>
