<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080706">
<title>Don Omar Radio Medellín</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#050505;font-family:Arial,Helvetica,sans-serif}
body{display:block;color:#fff}
.pagina{width:100%;max-width:711px;margin:0 auto;background:#050505;overflow:hidden}
.hero{width:100%;display:block}
.hero img{display:block;width:100%;height:auto}
.menu{padding:14px 12px 24px;background:linear-gradient(180deg,#090806 0%,#030303 100%)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{min-height:92px;border:1px solid rgba(216,157,57,.65);border-radius:16px;background:linear-gradient(145deg,#17130d,#080807);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 5px 16px rgba(0,0,0,.45);color:#f4e5c5;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 6px;transition:transform .12s ease,filter .12s ease,border-color .12s ease}
.btn strong{font-size:13px;letter-spacing:.8px;line-height:1.15}
.btn span{font-size:9px;color:#b8b0a0;margin-top:7px;letter-spacing:1px;text-transform:uppercase}
.btn .ico{font-size:24px;margin-bottom:7px;color:#d9a441;line-height:1}
.btn:active{transform:scale(.97);filter:brightness(1.25)}
.btn:hover{border-color:#e7b85a}
.footer{padding:8px 16px 22px;text-align:center;color:#6f685e;font-size:9px;letter-spacing:1.5px;text-transform:uppercase}
@media(max-width:430px){.grid{gap:8px}.btn{min-height:88px;border-radius:14px}.btn strong{font-size:11px}}

/* CARRUSEL DE PLAYLISTS INTEGRADO */
/* === CARRUSEL 100 PLAYLISTS INTEGRADO === */
.playlists100-section{display:none;width:100%;background:#000;overflow:hidden;clear:both}

.hdr{width:100%;margin:0;transform:none;overflow:hidden;background:#000;line-height:0}.hdr img{width:100%;display:block}
.luxo{max-width:760px;margin:10px auto 6px;padding:0 18px;font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;line-height:1.35;letter-spacing:.3px;color:#e8e6e1}
.luxo .line1{display:block}.luxo .line2{display:block;color:#00c8ff;margin-top:3px}
.desliza{font-weight:900;font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:#fff;margin:7px 0 8px;display:flex;align-items:center;justify-content:center;gap:18px}
.desliza span:first-child,.desliza span:last-child{color:#ffd24a;text-shadow:0 0 7px #ffd24a,0 0 16px rgba(255,180,0,.75);font-size:30px;line-height:1;animation:arrowPulse 1.15s ease-in-out infinite}
.desliza span:last-child{animation-delay:.575s}
@keyframes arrowPulse{0%,100%{transform:translateX(0) scale(1);opacity:.78}50%{transform:translateX(-7px) scale(1.12);opacity:1}}
.desliza span:last-child{animation-name:arrowPulseRight}
@keyframes arrowPulseRight{0%,100%{transform:translateX(0) scale(1);opacity:.78}50%{transform:translateX(7px) scale(1.12);opacity:1}}
.play-section{border-top:3px double #0a84ff;border-bottom:3px double #0a84ff;padding:7px 0 10px;background:#000}
.play-head{display:none}



.live-strip{max-width:520px;margin:14px auto 0;padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid #194f76;border-radius:999px;background:#030b12;color:#dceeff;font-size:11px;font-weight:900;letter-spacing:2px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#ff304f;box-shadow:0 0 10px rgba(255,48,79,.8)}
.live-small{color:#00c8ff;font-size:9px}
.play-section{border-top:5px double #0a84ff;border-bottom:5px double #0a84ff;padding:18px 0 28px;background:#000}
.play-head{max-width:900px;margin:0 auto;padding:0 16px 14px;text-align:center}
.play-kicker{font-family:Bebas Neue,cursive;font-size:18px;letter-spacing:4px;color:#00ccff}
.play-title{font-family:Bebas Neue,cursive;font-size:clamp(38px,10vw,64px);letter-spacing:2px;line-height:.95;margin:5px 0;color:#fff;text-shadow:0 0 16px rgba(0,132,255,.45)}
.play-title span{color:#00a8ff}
.play-sub{font-size:12px;letter-spacing:3px;color:#aebdcc;text-transform:uppercase;margin-top:8px}
.carousel-wrap{width:100%;max-width:620px;margin:0 auto;padding:0 8px}
.carousel-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 5px}
.carousel-arrow{width:58px;height:50px;border:1px solid #ffd24a;border-radius:15px;background:#03070b;color:#ffd24a;font-size:32px;line-height:1;cursor:pointer;box-shadow:0 0 10px rgba(255,210,74,.28),inset 0 0 12px rgba(255,210,74,.06);text-shadow:0 0 8px #ffd24a;transition:transform .15s ease}
.carousel-arrow:active{transform:scale(.92)}
.carousel-count{font-family:Bebas Neue,cursive;font-size:20px;letter-spacing:2px;color:#fff}
.carousel-viewport{overflow:hidden;border-radius:18px;touch-action:pan-y}
.carousel-track{display:flex;transition:transform .28s ease;will-change:transform}
.carousel-slide{min-width:100%;padding:2px}
.carousel-card{border:2px solid #0a84ff;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#08131e,#02070b);box-shadow:0 0 22px rgba(0,132,255,.20),0 10px 30px rgba(0,0,0,.55)}
.carousel-cover{position:relative;aspect-ratio:1/1;overflow:hidden;background:#02060b}
.carousel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.carousel-number{position:absolute;top:10px;left:10px;z-index:2;background:rgba(0,0,0,.82);border:1px solid #00a8ff;border-radius:8px;padding:5px 9px;color:#00c8ff;font-family:Bebas Neue,cursive;font-size:20px}
.carousel-info{padding:8px 10px 10px;text-align:center;background:#05090d}
.carousel-name{font-family:Bebas Neue,cursive;font-size:22px;letter-spacing:1px;line-height:1.05;color:#fff;min-height:34px;display:flex;align-items:center;justify-content:center}
.listen-main{display:inline-flex;align-items:center;justify-content:center;margin-top:7px;min-width:135px;padding:9px 18px;border:1px solid #00c8ff;border-radius:999px;background:linear-gradient(180deg,#06233a,#03101b);color:#00c8ff;font-size:13px;font-weight:900;letter-spacing:1.5px;cursor:pointer}
.carousel-dots{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.carousel-dot{width:7px;height:7px;border:0;border-radius:50%;background:#31404d;padding:0}
.carousel-dot.active{background:#00c8ff;transform:scale(1.35)}
.swipe-note{text-align:center;color:#778b9d;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-top:8px}
.collection-label{
  text-align:center;
  color:#00c8ff;
  font-size:13px;
  font-weight:700;
  letter-spacing:2.5px;
  text-transform:uppercase;
  margin:18px 0 8px;
  text-shadow:0 0 10px rgba(0,200,255,.35);
}

/* Header final adjustment: 30% shorter, full screen width */
/* Header: full screen width, 30% shorter */
.hdr {
  width: 100% !important;
  height: 70vw !important;
  margin: 0 !important;
  transform: none !important;
  overflow: hidden !important;
}
.hdr img {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  display: block !important;
}




html{scroll-behavior:smooth}

.live-image-button{display:block;width:100%;border:0;padding:0;margin:0 auto 18px;background:transparent;cursor:pointer;line-height:0}
.live-image-button img{display:block;width:100%;height:auto}
.approved-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;align-items:start}
.approved-grid a{display:block;line-height:0;min-width:0}
.approved-grid img{display:block;width:100%;height:auto}
.twitch-panel{width:100%;margin:0 auto 18px;aspect-ratio:16/9;background:#000}
.twitch-panel[hidden]{display:none}
.twitch-panel iframe{width:100%;height:100%;border:0;display:block}


.close-playlists{
  display:block; position:sticky; top:8px; z-index:100;
  margin:12px 12px 16px auto; padding:11px 17px;
  border:2px solid #39d9ff; border-radius:14px;
  background:#020a14; color:#fff; font-size:14px; font-weight:800;
  letter-spacing:1px; box-shadow:0 0 12px rgba(57,217,255,.45);
  cursor:pointer;
}
.close-playlists:active{transform:scale(.97)}

</style>

const playlistData=PLAYLIST_DATA;
const playlistTrack=document.getElementById('playlistTrack');
const playlistCount=document.getElementById('playlistCount');
const playlistDots=document.getElementById('playlistDots');
let currentPlaylist=0;

function makeSlide(item){
  const slide=document.createElement('div');
  slide.className='carousel-slide';
  slide.innerHTML='<div class="carousel-card"><div class="carousel-cover"><span class="carousel-number">'+String(item.n).padStart(2,'0')+'</span><img alt="Carátula de '+item.name+'" loading="lazy"></div><div class="carousel-info"><div class="carousel-name">'+item.name+'</div><button class="listen-main" type="button">▶ ESCUCHAR</button></div></div>';
  const img=slide.querySelector('img');
  slide.querySelector('.listen-main').onclick=()=>window.open(item.url,'_blank');
  fetch('https://open.spotify.com/oembed?url='+encodeURIComponent(item.url))
    .then(r=>r.ok?r.json():Promise.reject())
    .then(data=>{if(data.thumbnail_url) img.src=data.thumbnail_url;})
    .catch(()=>{});
  return slide;
}

function renderCarousel(){
  playlistTrack.innerHTML='';
  for(let i=0;i<90;i++){
    const item=playlistData[i];
    if(item) playlistTrack.appendChild(makeSlide(item));
    else{
      const slide=document.createElement('div');
      slide.className='carousel-slide';
      slide.innerHTML='<div class="carousel-card"><div class="carousel-cover"><span class="carousel-number">'+String(i+1).padStart(2,'0')+'</span><div style="height:100%;display:flex;align-items:center;justify-content:center;font-family:Bebas Neue,cursive;font-size:30px;color:#778b9d">PRÓXIMAMENTE</div></div><div class="carousel-info"><div class="carousel-name">PLAYLIST '+String(i+1).padStart(2,'0')+'</div><button class="listen-main" disabled style="opacity:.45;cursor:default">PRÓXIMAMENTE</button></div></div>';
      playlistTrack.appendChild(slide);
    }
  }
  playlistDots.innerHTML='';
  for(let i=0;i<90;i++){
    const d=document.createElement('button');
    d.className='carousel-dot'+(i===0?' active':'');
    d.setAttribute('aria-label','Ir a playlist '+(i+1));
    d.onclick=()=>goPlaylist(i);
    playlistDots.appendChild(d);
  }
  updateCarousel();
}
function goPlaylist(index){
  currentPlaylist=(index+90)%90;
  updateCarousel();
}
function updateCarousel(){
  playlistTrack.style.transform='translateX(-'+(currentPlaylist*100)+'%)';
  playlistCount.textContent=String(currentPlaylist+1).padStart(2,'0')+' / 90';
  [...playlistDots.children].forEach((d,i)=>d.classList.toggle('active',i===currentPlaylist));
}
document.getElementById('prevPlaylist').onclick=()=>goPlaylist(currentPlaylist-1);
document.getElementById('nextPlaylist').onclick=()=>goPlaylist(currentPlaylist+1);

let touchStartX=0,touchStartY=0;
const viewport=document.getElementById('playlistViewport');
viewport.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});
viewport.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)) goPlaylist(currentPlaylist+(dx<0?1:-1));
},{passive:true});
renderCarousel();

  closePlaylistsButton.addEventListener('click', () => {
    playlistsSection.style.display = 'none';
    document.getElementById('mainMenu')?.scrollIntoView({behavior:'smooth', block:'start'});
  });
}




async function loadSpotifyCovers(){
  const cards=[...document.querySelectorAll('.card[data-url]')];
  for(const card of cards){
    const url=card.dataset.url;
    const box=card.querySelector('.card-img');
    const img=box.querySelector('img');
    try{
      const r=await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent(url));
      if(!r.ok) throw new Error('Spotify oEmbed');
      const data=await r.json();
      if(data.thumbnail_url){
        img.src=data.thumbnail_url;
        img.onload=()=>box.classList.add('loaded');
      }
    }catch(e){}
  }
}
function openPlaylist(card){ window.open(card.dataset.url,'_blank'); }
loadSpotifyCovers();
